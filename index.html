<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn Turtle</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>Learn Turtle</h1>
  <span class="spacer"></span>
  <span class="status" id="status">Loading Python...</span>
</header>

<main>
  <section class="left">
    <div class="panel codepanel">
      <div class="controls">
        <button id="bStart" title="Start over"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z" fill="currentColor"/></svg></button>
        <button id="bBack" title="Back one step (left arrow)"><svg viewBox="0 0 24 24"><path d="M16 5v14L5 12z" fill="currentColor"/></svg></button>
        <button id="bNext" class="primary" title="Next step (right arrow)"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>Next</button>
        <button id="bSkip" title="Skip over the function"><svg viewBox="0 0 24 24"><path d="M4 16c2-6 10-8 15-4l1-3 2 8-8-1 3-2c-4-3-9-2-11 3z" fill="currentColor"/></svg></button>
        <button id="bToStop" title="Go to the next stop sign (click a line number to add one)"><svg viewBox="0 0 24 24"><path d="M8 2h8l6 6v8l-6 6H8l-6-6V8z" fill="#d93025"/></svg></button>
        <button id="bPlay" title="Play / pause (Cmd+Enter)"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></button>
        <span class="spacer"></span>
        <button id="bExplain" aria-pressed="true" title="Explanations on / off"><svg viewBox="0 0 24 24"><path d="M4 4h16v12H9l-5 4z" fill="currentColor"/></svg></button>
        <select id="speed" title="Play speed" aria-label="Play speed">
          <option value="0.5">0.5x</option><option value="1">1x</option><option value="2" selected>2x</option><option value="4">4x</option><option value="20">max</option>
        </select>
      </div>
      <div id="editor" aria-label="Code"></div>
    </div>
    <div class="panel turtles" id="turtles"></div>
  </section>

  <section class="side">
    <div class="panel">
      <canvas id="cv"></canvas>
      <div class="canvasbar"><span class="coords" id="coords"></span><label class="check"><input id="grid" type="checkbox" checked> Grid</label></div>
    </div>
    <div class="panel error" id="error" hidden><div id="errText"></div><div class="raw" id="errRaw"></div></div>
    <div class="panel warn" id="warn" hidden>This program uses <code>forward()</code> and also <code>name.forward()</code>. Pick one style. To use many turtles, say which turtle moves: <code>tracy.forward(50)</code>.</div>
    <div class="panel">
      <h2>Boxes (variables)</h2>
      <div class="frames" id="frames"></div>
    </div>
    <div class="panel out" id="outBox" hidden><h2>Printed</h2><div id="out"></div></div>
  </section>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
