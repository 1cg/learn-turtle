<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn Turtle</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>Learn Turtle</h1>
  <span class="spacer"></span>
  <span class="status" id="status">Loading Python...</span>
</header>

<main>
  <section class="left">
    <div class="panel">
      <div id="editor" aria-label="Code"></div>
    </div>
    <div class="panel btns">
      <button id="bRun" class="primary" disabled><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>Run</button>
      <button id="bStop" disabled><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" fill="currentColor"/></svg>Stop</button>
      <span class="spacer"></span>
      <label class="speed">Slow <input id="speed" type="range" min="1" max="10" value="6"> Fast</label>
      <label class="check"><input id="grid" type="checkbox" checked> Grid</label>
    </div>
  </section>

  <section class="side">
    <div class="panel">
      <canvas id="cv"></canvas>
      <div class="coords" id="coords"></div>
    </div>
    <div class="panel error" id="error" hidden></div>
    <div class="panel out" id="outBox" hidden><h2>Printed</h2><div id="out"></div></div>
  </section>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
