<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Progress test</title>
<style>body{font:14px monospace;margin:16px;background:#fff;color:#111}.ok{color:green}.bad{color:#b00}</style>
</head>
<body>
<h1>Progress test</h1>
<div id="log">running...</div>
<script type="module">
import { collect, encode, decode, merge, startCode } from "../js/progress.js";
import { LESSONS } from "../lessons/lessons.js";

const log = document.getElementById("log");
log.textContent = "";
const say = (t, ok) => { const d = document.createElement("div"); d.textContent = t; d.className = ok ? "ok" : "bad"; log.append(d); };

// A fake storage, same shape as `store` in js/lessons.js.
const mem = (init = {}) => { const m = new Map(Object.entries(init)); return { get: (k) => m.has(k) ? m.get(k) : null, set: (k, v) => m.set(k, String(v)), m }; };
const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const L = LESSONS;
const [a, b, c] = L;
// Step 1 of each lesson is a try step.
const A = a.id + ":1", B = b.id + ":1", C = c.id + ":1";

const cases = [];
const test = (name, fn) => cases.push([name, fn]);

test("lessons start with watch, then try", () => [a, b, c].every((l) => l.steps[0].kind === "watch" && l.steps[1].kind === "try"));

test("collect: done and real code, skip start code and empty", () => {
  const s = mem({
    ["lt:done:" + a.id]: "1", ["lt:done:" + A]: "1", ["lt:code:" + A]: a.steps[1].solution,
    ["lt:code:" + B]: startCode(b, 1), ["lt:code:" + C]: "  \n",
    "lt:code:free": "forward(1)\n", "lt:done:nope": "1",
  });
  return eq(collect(s, L), { v: 2, done: [a.id, A], code: { [A]: a.steps[1].solution } });
});

test("start code: try = watch code, extend = solution before", () =>
  startCode(a, 1) === a.steps[0].code && startCode(a, 2) === a.steps[1].solution);

test("encode then decode gives the same progress", async () => {
  const p = { v: 2, done: [a.id, A], code: { [A]: "forward(100)  # \u00e9 \u00fc \ud83d\udc22\n" } };
  return eq(await decode(await encode(p)), p);
});

test("encode gives base64url only", async () => /^[A-Za-z0-9_-]+$/.test(await encode({ v: 2, done: [], code: {} })));

test("merge: done adds up, never removes; report lists lessons only", () => {
  const s = mem({ ["lt:done:" + b.id]: "1" });
  const r = merge(s, { v: 2, done: [a.id, A, b.id, "unknown-9"], code: {} }, L);
  return eq(r, { done: [a.id], code: [] }) && s.get("lt:done:" + A) === "1" && s.get("lt:done:unknown-9") === null;
});

test("merge: link code goes in where no code or start code only", () => {
  const s = mem({ ["lt:code:" + B]: startCode(b, 1) });
  const r = merge(s, { v: 2, done: [], code: { [A]: "A\n", [B]: "B\n" } }, L);
  return eq(r, { done: [], code: [A, B] }) && s.get("lt:code:" + A) === "A\n" && s.get("lt:code:" + B) === "B\n";
});

test("merge: code on this computer wins", () => {
  const s = mem({ ["lt:code:" + A]: "mine\n" });
  const r = merge(s, { v: 2, done: [], code: { [A]: "theirs\n" } }, L);
  return eq(r.code, []) && s.get("lt:code:" + A) === "mine\n";
});

test("merge: start-code-only code in the link changes nothing", () => {
  const s = mem();
  const r = merge(s, { v: 2, done: [], code: { [A]: startCode(a, 1) } }, L);
  return eq(r.code, []) && s.get("lt:code:" + A) === null;
});

for (const [name, bad] of [["bad letters", "abc$%"], ["cut short", null], ["not progress", "q1YqUbJSKkktLlGqBQA"], ["empty", ""]]) {
  test("decode rejects: " + name, async () => {
    let text = bad;
    if (text === null) { const full = await encode({ v: 2, done: [a.id], code: { [A]: a.steps[1].solution } }); text = full.slice(0, full.length / 2); }
    try { await decode(text); return false; } catch (e) { return e instanceof Error && e.message.length > 0; }
  });
}

let pass = 0;
for (const [name, fn] of cases) {
  let ok = false;
  try { ok = await fn(); } catch (e) { console.error(name, e); }
  if (ok) pass++; else console.error("FAIL", name);
  say(`${ok ? "PASS" : "FAIL"} ${name}`, ok);
}

// Link length with all lessons and steps done and each solution as code.
const all = { v: 2, done: [], code: {} };
for (const l of L) {
  all.done.push(l.id);
  l.steps.forEach((st, i) => { all.done.push(l.id + ":" + i); if (st.solution) all.code[l.id + ":" + i] = st.solution; });
}
const text = await encode(all);
const url = "https://learnturtle.org/#p=" + text;
const json = JSON.stringify(all).length;
const back = eq(await decode(text), all);
say(`${back ? "PASS" : "FAIL"} full link: ${L.length} lessons, ${Object.keys(all.code).length} steps, JSON ${json} chars, link ${url.length} chars`, back);
if (back) pass++;

const total = cases.length + 1;
say(`${pass}/${total} pass`, pass === total);
document.title = `${pass}/${total} pass`;
window.RESULT = { pass, total, linkLength: url.length, jsonLength: json };
</script>
</body>
</html>
